name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # --collect-all pymavlink: pymavlink picks its MAVLink dialect module
      # (pymavlink.dialects.v20.ardupilotmega) via a dynamic import at
      # runtime, not a plain `import` statement PyInstaller's static
      # analysis can see -- without this flag the built exe connects to
      # nothing and fails silently. --add-data bundles the frontend's built
      # static files into the exe under "frontend_dist", matching the path
      # server.py looks for when sys.frozen is set.
      - name: Build exe with PyInstaller
        working-directory: backend
        run: >
          pyinstaller --onefile --console --name GhostPlanner
          --collect-all pymavlink
          --add-data "../frontend/dist;frontend_dist"
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: GhostPlanner-windows-exe
          path: backend/dist/GhostPlanner.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/GhostPlanner.exe

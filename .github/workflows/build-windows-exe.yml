name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # --collect-all pymavlink: pymavlink picks its MAVLink dialect module
      # (pymavlink.dialects.v20.ardupilotmega) via a dynamic import at
      # runtime, not a plain `import` statement PyInstaller's static
      # analysis can see -- without this flag the built exe connects to
      # nothing and fails silently. --add-data bundles the frontend's built
      # static files into the exe under "frontend_dist", matching the path
      # server.py looks for when sys.frozen is set.
      - name: Build exe with PyInstaller
        working-directory: backend
        run: >
          pyinstaller --onefile --console --name GhostPlanner
          --collect-all pymavlink
          --add-data "../frontend/dist;frontend_dist"
          server.py

      # A successful PyInstaller build only proves packaging didn't error --
      # it doesn't prove the exe actually launches, that Flask binds, or
      # that the bundled frontend gets served correctly (the frozen-path
      # resolution and pymavlink's dynamic dialect import are both only
      # verified at runtime, not at build time). No radio/Cube hardware is
      # attached to this runner, so this can't test the actual driving
      # functionality -- but it does catch "the exe is broken" before
      # anyone downloads it to find out by hand.
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "backend\dist\GhostPlanner.exe" -RedirectStandardOutput "exe_stdout.log" -RedirectStandardError "exe_stderr.log" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                $status = Invoke-WebRequest -Uri "http://localhost:5050/status" -UseBasicParsing -TimeoutSec 3
                $ui = Invoke-WebRequest -Uri "http://localhost:5050/" -UseBasicParsing -TimeoutSec 3
                if ($status.StatusCode -eq 200 -and $ui.StatusCode -eq 200 -and $ui.Content -match "Ghost Planner") {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              Write-Host "--- stdout ---"; Get-Content "exe_stdout.log" -ErrorAction SilentlyContinue
              Write-Host "--- stderr ---"; Get-Content "exe_stderr.log" -ErrorAction SilentlyContinue
              throw "GhostPlanner.exe did not come up and serve the UI within 20s"
            }
            Write-Host "Smoke test passed: exe launched, /status and / both responded."
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GhostPlanner-windows-exe
          path: backend/dist/GhostPlanner.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/GhostPlanner.exe
